- title: Built around the child 
  image: images/approach-2.jpg
  body: >
    We take time to understand each child’s communication, interests, strengths and support needs. 
    Their choices and ways of expressing themselves help shape our goals and sessions. 
    We support children not only to respond to others, but also to initiate, ask, refuse, 
    explore and influence their own experiences.

- title: Learning for everyday life
  image: images/approach-4.png
  body: >
    We bring education and therapy together to build skills that matter beyond a session. 
    Whether the goal involves communication, learning, play or independence, we ask how it 
    supports the child’s everyday life. We also adapt activities, adult support and 
    environments to make participation more accessible - not place every expectation 
    for change on the child.


- title: Working alongside families
  image: images/approach-1.jpg
  body: >
    Families bring knowledge of their children that is essential to our work. 
    We welcome parents into the learning process through observation, discussion and regular reviews. 
    Together, we choose meaningful goals, understand how learning carries over into daily life and 
    adjust our support as the child’s needs and family priorities evolve.

- title: Thoughtful Practice
  image: images/approach-3.jpg
  body: >
    We combine careful planning and documentation with a willingness to question our assumptions. 
    Weekly team reviews, regular parent conversations and monthly therapist training 
    inform our everyday work. When an approach is not helping a child, 
    we use that feedback to reconsider and adapt - keeping their engagement, 
    well-being and meaningful progress at the centre.


