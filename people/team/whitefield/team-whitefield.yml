
- name: Deepthi
  subtitle: Senior Therapist
  photo: 
  bio: |
    Deepthi is a Senior Therapist at Sambhavam, where she helps translate the centre’s vision into thoughtful, consistent everyday practice. Her work focuses on strengthening the quality of therapy, maintaining meaningful documentation, and supporting interventions that improve children’s quality of life—both in the classroom and in one-to-one sessions.
    Calm, meticulous and deeply committed, Deepthi brings preparation and follow-through to her work. She approaches sessions with materials and plans ready, responds attentively to needs as they arise, and follows through until agreed actions are carried out. She plays an important role in helping the team turn shared goals into purposeful support for each child.


- name: Martha
  subtitle: Senior Therapist
  photo: ../people/team/whitefield/martha.jpg
  bio: |
    Martha is a therapist at Sambhavam with a postgraduate qualification in psychology and training towards certification in behaviour analysis. She brings a calm, poised presence to her work, alongside a disciplined approach and a strong sense of professional responsibility.
    Committed and dependable, Martha approaches her work with punctuality, attentiveness and care. Her ability to remain composed and fully present is a valued part of what she brings to the team and her interactions with children.
    Martha sees her work at Sambhavam as part of a long-term commitment to the field. She takes her responsibilities seriously and is motivated to deepen her practice and make a meaningful contribution over time.
