  bio: |
    Chithra Seshadri is an educator, teacher trainer and educational consultant whose work brings together child development, curriculum design and inclusive education. As Director of Sambhavam, she works with children, families and educators to create learning experiences that respond to each child’s strengths, interests and support needs.
    Her experience spans teaching science,sociology and psychology to high-school students, supporting autistic learners, designing differentiated curricula and guiding teachers in classroom practice. She is particularly interested in translating ideas from educational psychology into practical approaches—helping educators observe carefully, understand how children learn and adapt their teaching thoughtfully.
    At Sambhavam, Chithra’s approach centres on children’s dignity, agency and meaningful participation. She sees inclusion not simply as placing a child in a classroom, but as an ongoing responsibility to make learning, relationships and everyday experiences accessible. Her work combines thoughtful planning with close attention to each child, while building the confidence and capacity of the adults who support them.

